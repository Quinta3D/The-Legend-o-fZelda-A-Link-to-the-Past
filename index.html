```html
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>The Legend of Zelda A Link to the Past</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

#game-container{
    width:100%;
    height:100%;
}

#fullscreen{
    position:fixed;
    top:15px;
    right:15px;
    z-index:99999;
    padding:12px 18px;
    background:#222;
    color:#fff;
    border:2px solid #fff;
    border-radius:8px;
    font-size:14px;
    font-weight:bold;
}
</style>
</head>

<body>

<div id="game-container"></div>

<button id="fullscreen">PANTALLA COMPLETA</button>

<script>
EJS_player='#game-container';
EJS_core='snes';
EJS_gameUrl='TheLegendofZeldaALinktothePast.smc';
EJS_startOnLoaded=true;
EJS_pathtodata='https://cdn.jsdelivr.net/gh/ethanaobrien/emulatorjs@main/data/';

function pantallaCompleta(){
    const e=document.documentElement;

    if(e.requestFullscreen)
        e.requestFullscreen();
    else if(e.webkitRequestFullscreen)
        e.webkitRequestFullscreen();

    document.getElementById('fullscreen').style.display='none';
}

document.getElementById('fullscreen').onclick=pantallaCompleta;

window.addEventListener('load',()=>{
    setTimeout(()=>{
        try{ pantallaCompleta(); }catch(e){}
    },1000);
});
</script>

<script src="https://cdn.jsdelivr.net/gh/ethanaobrien/emulatorjs@main/data/loader.js"></script>

</body>
</html>
